name: Verify Jaga IGD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jaga
          POSTGRES_PASSWORD: jaga
          POSTGRES_DB: jaga_igd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jaga -d jaga_igd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jaga:jaga@127.0.0.1:5432/jaga_igd_test
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npm run db:setup && npm run test:integration
      - run: npx playwright-core install --with-deps chromium
      - name: API and browser smoke tests
        run: |
          npm run dev > /tmp/jaga-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 'http://localhost:5173/api/cases' > /dev/null; then
            cat /tmp/jaga-dev.log
            exit 1
          fi
          SMOKE_URL=http://localhost:5173 npm run test:deployment
          npm run test:browser
